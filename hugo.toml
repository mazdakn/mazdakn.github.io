baseURL = 'https://www.mazdak.tech/'
languageCode = 'en-us'
title = 'Mazdak Nasab'
theme = 'hugo-clarity'
enableGitInfo = true
ignoreFiles = ['README\.md$']

[params]
  mainSections = ['posts']

[markup.goldmark.renderHooks.link]
  enableDefault = true

[frontmatter]
  date = ['date', ':git', ':fileModTime', ':default']

[[cascade]]
  title = 'About Me'
  showtitle = false
  sidebar = true
  toc = false
  showdate = false
  showreadtime = false
  showshare = false
  [cascade._target]
    path = '{/,/about}'

[[cascade]]
  draft = false
  sidebar = true
  toc = true
  [cascade._target]
    path = '/posts/**'

[[cascade]]
  draft = true
  sidebar = true
  toc = false
  [cascade._target]
    path = '/resume/**'

[[menu.main]]
  name = "About"
  url = ""
  weight = -110

[[menu.main]]
  name = "Posts"
  url = "posts/"
  weight = -109

# social menu links
[[menu.social]]
  name = "github"
  type = "social"
  weight = 1
  url = "https://github.com/mazdakn"
[[menu.social]]
  name = "linkedin"
  weight = 2
  url = "https://www.linkedin.com/in/mazdakn"
[[menu.social]]
  name = "rss"
  weight = 3
  url = "index.xml"
